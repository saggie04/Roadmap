ge and pull-request workflows."},{"id":"java.w30.t2","t":"Use Maven clean, test, package and dependency inspection."},{"id":"java.w30.t3","t":"Add structured logging and avoid printing secrets or personal data."},{"id":"java.w30.t4","t":"Review code for duplication, naming, small methods and clear responsibilities."}]}]},{"id":"java.w31","no":31,"title":"Docker and local environments","meta":"","intro":"Understand images, containers, ports, volumes, environment variables and Docker Compose.","project":{"h":"Practical project","t":"Create a Docker Compose setup that starts the Spring Boot API and MySQL database with documented environment variables.","id":"java.w31.p"},"lists":[],"links":[["Docker getting started","https://docs.docker.com/get-started/"],["Docker Compose quickstart","https://docs.docker.com/compose/gettingstarted/"],["Spring Boot Docker guide","https://spring.io/guides/topicals/spring-boot-docker/"]],"tutor":true,"groups":[{"h":"Study and complete","tasks":[{"id":"java.w31.t0","t":"Install Docker Desktop or use an available container environment."},{"id":"java.w31.t1","t":"Write a Dockerfile for the Spring Boot backend."},{"id":"java.w31.t2","t":"Run MySQL in a container with a persistent volume."},{"id":"java.w31.t3","t":"Use Docker Compose to start the backend and database together."},{"id":"java.w31.t4","t":"Read container logs and troubleshoot startup, port and connection issues."}]}]},{"id":"java.w32","no":32,"title":"Deployment and CI basics","meta":"","intro":"Understand frontend hosting, backend hosting, managed databases, HTTPS, environment configuration and basic CI.","project":{"h":"Practical project","t":"Deploy the full-stack commerce application. Add a CI workflow that runs tests on each push or pull request.","id":"java.w32.p"},"lists":[],"links":[["GitHub Actions Java with Maven","https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven"],["Vercel documentation","https://vercel.com/docs"],["Render docs","https://render.com/docs"]],"tutor":true,"groups":[{"h":"Study and complete","tasks":[{"id":"java.w32.t0","t":"Choose a hosting approach for React static files and the Spring Boot API."},{"id":"java.w32.t1","t":"Deploy the backend and connect it to a managed or securely hosted database."},{"id":"java.w32.t2","t":"Configure production environment variables and HTTPS."},{"id":"java.w32.t3","t":"Create a GitHub Actions workflow to build and test the backend."},{"id":"java.w32.t4","t":"Verify logs, health endpoints, database connectivity and error handling after deployment."}]}]}]},{"id":"m9","label":"Month 09","title":"Advanced engineering and portfolio","intro":"Outcome: Improve architecture, understand production concerns and present two or three credible projects.","weeks":[{"id":"java.w33","no":33,"title":"SOLID and design patterns","meta":"","intro":"Learn the five SOLID principles and practical patterns such as Strategy, Factory, Builder and Observer. Refactor only where a real design problem exists.","project":{"h":"Practical project","t":"Refactor payment or notification logic in the commerce app using interfaces and an appropriate design pattern. Add tests to prove behaviour is unchanged.","id":"java.w33.p"},"lists":[],"links":[["SOLID principles — Refactoring Guru","https://refactoring.guru/refactoring"],["Design patterns — Refactoring Guru","https://refactoring.guru/design-patterns"],["Spring dependency injection","https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html"]],"tutor":true,"groups":[{"h":"Study and complete","tasks":[{"id":"java.w33.t0","t":"Explain each SOLID principle with a small Java example."},{"id":"java.w33.t1","t":"Use Strategy to select behaviour without large conditional blocks."},{"id":"java.w33.t2","t":"Use Factory or Builder where object creation is complex."},{"id":"java.w33.t3","t":"Understand dependency inversion and constructor injection."},{"id":"java.w33.t4","t":"Refactor one service and write down why the new design is clearer."}]}]},{"id":"java.w34","no":34,"title":"Performance, caching and Redis","meta":"","intro":"Learn how to measure latency, inspect SQL queries, use pagination and understand caching, cache expiry and invalidation.","project":{"h":"Practical project","t":"Add caching to product catalogue reads or another suitable endpoint. Document the cache strategy and how updates invalidate cached data.","id":"java.w34.p"},"lists":[],"links":[["Redis documentation","https://redis.io/docs/latest/"],["MySQL EXPLAIN","https://dev.mysql.com/doc/refman/8.4/en/explain.html"],["Spring caching","https://docs.spring.io/spring-framework/reference/integration/cache.html"]],"tutor":true,"groups":[{"h":"Study and complete","tasks":[{"id":"java.w34.t0","t":"Measure a slow endpoint before changing it."},{"id":"java.w34.t1","t":"Inspect SQL with EXPLAIN and add an index only when justified."},{"id":"java.w34.t2","t":"Understand cache keys, TTL, invalidation and stale data."},{"id":"java.w34.t3","t":"Add Redis caching to a read-heavy endpoint if your project benefits."},{"id":"java.w34.t4","t":"Compare response times before and after and document the result."}]}]},{"id":"java.w35","no":35,"title":"Microservices and messaging concepts","meta":"","intro":"Understand modular monoliths, service boundaries, synchronous calls, asynchronous events, Kafka concepts and eventual consistency. Do not split a project into services without a reason.","project":{"h":"Practical project","t":"Create a small event-driven proof of concept or a detailed architecture design for order notifications. Keep the main application modular unless splitting has a clear benefit.","id":"java.w35.p"},"lists":[],"links":[["Spring microservices guides","https://spring.io/microservices"],["Apache Kafka introduction","https://kafka.apache.org/intro"],["Microservices.io patterns","https://microservices.io/patterns/index.html"]],"tutor":true,"groups":[{"h":"Study and complete","t function weekH(w,t){
 const left=[w.intro?`<p class="lead">${esc(w.intro)}</p>`:'',...w.lists.map((l,li)=>`<section class="blk"><h4>${esc(l.h)}<em>${cnt(l.items.map((_,i)=>lid(w,li,i)))} / ${l.items.length}</em></h4>${l.items.map((x,i)=>taskH(lid(w,li,i),x,l.kind==='days'?'Day '+(i+1):l.kind==='steps'?(i+1)+'.':'')).join('')}</section>`)];

 const done=w.done?`<div class="done"><b>Done when:</b> ${esc(w.done)}</div>`:'';

 const gs=w.groups.map(g=>`<section class="grp"><h4>${esc(g.h)}<em>${cnt(g.tasks.map(x=>x.id))} / ${g.tasks.length}</em></h4>${g.tasks.map(x=>taskH(x.id,x.t,x.l,x.u)).join('')}</section>`);
 const mine=`<section class="grp mine" data-mine="${w.id}">${mineH(w)}</section>`;

 const wb=`<button class="btn wkall" type="button" data-wk="${w.id}">Mark week complete</button>`;

 return`<details class="wk" id="${w.id}" ${S.open[w.id]?'open':''}><summary><span class="bdg">${w.no}</span><span class="wt"><b>${esc(w.title)}</b>${w.meta?`<span>${esc(w.meta)}</span>`:''}</span><span class="pg"><span class="cn"></span><i><b></b></i></span>${chev}</summary><div class="wb${days?' days':''}">${leftAll}<div>${right}</div></div></details>`}
function extraH(e){const b=e.blocks.map(b=>{const h=b.h?`<h4>${esc(b.h)}</h4>`:'';
 if(b.kind==='bullets')return`<div class="blk">${h}<ul>${b.items.map(i=>`<li>${fmt(i)}</li>`).join('')}</ul></div>`;

 return`<div class="res">${b.items.filter(l=>/^https?:/.test(l[1])).map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener noreferrer">${esc(l[0])}<small>${esc(l[2]||'')}</small></a>`).join('')}</div>`}).join('');
 return`<section class="sec" id="x-${e.id}" data-x><div class="ph"><header><h2>${esc(e.title)}</h2></header>${e.intro?`<p>${esc(e.intro)}</p>`:''}</div>${e.blocks.some(b=>b.kind==='links')?b:`<div class="pan">${b}</div>`}</section>`}

document.addEventListener('change',e=>{const i=e.target.closest('input[data-id]');if(!i)return;if(i.checked)S.checks[i.dataset.id]=1;else delete S.checks[i.dataset.id];save();refresh()});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('wk')){if(e.target.open)S.open[e.target.id]=1;else delete S.open[e.target.id];save()}},true);
document.addEventListener('submit',e=>{const f=e.target.closest('.add');if(!f)return;e.preventDefault();const v=f.querySelector('input').value.trim();if(!v)return;const w=f.dataset.w;(S.custom[w]=S.custom[w]||[]).push({id:tid+'.c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:v});save();remine(w);const ni=document.querySelector(`[data-mine="${w}"] .add input`);ni&&ni.focus();refresh()});
function remine(w){const t=T.find(x=>x.id===tid),wk=weeks(t).find(x=>x.id===w);$(`[data-mine="${w}"]`).innerHTML=mineH(wk)}
document.addEventListener('click',e=>{const c=e.target.closest('button,a');if(!c)return;
 if(c.dataset.tab){location.hash=c.dataset.tab}
 else if(c.dataset.del){e.preventDefault();const w=c.dataset.w;S.custom[w]=S.custom[w].filter(x=>x.id!==c.dataset.del);delete S.checks[c.dataset.del];save();remine(w);refresh()}
 else if(c.dataset.go){const el=document.getElementById(c.dataset.go);el&&el.scrollIntoView()}
 else if(c.dataset.tut){const t=T.find(x=>x.id===tid),w=weeks(t).find(x=>x.id===c.dataset.tut);const L=w.lists.map(l=>l.h+':\n'+l.items.map((i,n)=>(l.kind==='bullets'?'- ':(n+1)+'. ')+i).join('\n')).join('\n\n');
  const p=`I am following the "${t.title}" and I am on week ${w.no}: ${w.title}.\n\nAct as my tutor. Explain simply, give hints before full answers, make me run things myself, and check my work against the goals below. At the end, quiz me with 5 questions.\n\n${w.intro||''}\n\n${L}\n\nProject: ${w.project?w.project.t:''}\n${w.done?'Done when: '+w.done:''}\n\nStart with the first thing I should open, read or type.`;
  navigator.clipboard.writeText(p).then(()=>toast('Tutor prompt copied. Paste it into Claude or ChatGPT.'),()=>toast('Copy failed. Allow clipboard access and try again.'))}
 else if(c.dataset.wk){const t=T.find(x=>x.id===tid),w=weeks(t).find(x=>x.id===c.dataset.wk),ids=wIds(w),all=cnt(ids)===ids.length;ids.forEach(i=>all?delete S.checks[i]:S.checks[i]=1);document.querySelectorAll(`#${CSS.escape(w.id)} input[data-id]`).forEach(x=>x.checked=!all);save();refresh();toast(all?'Week cleared.':'Week marked complete.')}
 else if(c.id==='cont'){const t=T.find(x=>x.id===tid),w=weeks(t).find(x=>cnt(wIds(x))<wIds(x).length)||weeks(t)[0],el=document.getElementById(w.id);$('#q').value='';filter();el.open=true;el.scrollIntoView({block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
 else if(c.id==='ea')document.querySelectorAll('.wk:not([hidden])').forEach(x=>x.open=true);
 else if(c.id==='ca')document.querySelectorAll('.wk').forEach(x=>x.open=false);
 else if(c.id==='exp'){const b=new Blob([JSON.stringify({app:'roadmap-hub',v:1,state:S},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='roadmap-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Progress file downloaded.')}
 else if(c.id==='imp')$('#file').click();
 else if(c.id==='rst'){const t=T.find(x=>x.id===tid);if(confirm(`Clear all progress and custom tasks for "${t.name}"? This cannot be undone.`)){Object.keys(S.checks).forEach(k=>k.startsWith(tid+'.')&&delete S.checks[k]);weeks(t).forEach(w=>delete S.custom[w.id]);save();$('#menu').open=false;render();toast('Roadmap reset.')}}
 if(!e.target.closest('#menu'))$('#menu').open=false});
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result).state;if(!j||typeof j.checks!=='object')throw 0;S=Object.assign({checks:{},custom:{},open:{},track:tid},j);save();render();toast('Progress imported.')}catch(x){toast('That file is not a Roadmap Hub progress file.')}};r.readAsText(f);e.target.value=''};
$('#q').addEventListener('input',filter);
addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}else if(e.key==='Escape')$('#q').blur()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(T.some(x=>x.id===h)&&h!==tid){tid=h;S.track=h;save();render();scrollTo(0,0)}});
addEventListener('beforeprint',()=>document.querySelectorAll('.wk').forEach(x=>x.open=true));
S.track=tid;render();
</script>
</body>
</html>
